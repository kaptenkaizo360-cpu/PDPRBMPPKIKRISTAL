<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permainan Susun Ayat - PPKI Tahun 5 (Edisi Guru)</title>
  
  <!-- Font Moden & Mesra Kanak-Kanak -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #6d28d9;
      --secondary: #ec4899;
      --secondary-dark: #be185d;
      --success: #10b981;
      --success-dark: #047857;
      --warning: #f59e0b;
      --warning-dark: #b45309;
      --danger: #ef4444;
      --bg-board: rgba(255, 255, 255, 0.95);
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      /* Animasi Latar Belakang Ceria */
      background: linear-gradient(-45deg, #c4b5fd, #fbcfe8, #a7f3d0, #fde68a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #canvas-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    .main-board {
      background: var(--bg-board);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.1), 
                  inset 0 4px 0 rgba(255,255,255,0.8);
      max-width: 900px;
      width: 100%;
      padding: 28px;
      text-align: center;
      position: relative;
      border: 4px solid #ffffff;
      z-index: 10;
    }

    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 12px 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .metric-badge {
      font-size: 1.2rem;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    .score-badge {
      background: #dcfce7;
      color: var(--success-dark);
    }

    .timer-badge {
      background: #fee2e2;
      color: var(--danger);
    }

    .lives-badge {
      font-size: 1.4rem;
      letter-spacing: 2px;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,0.1));
    }

    h1 {
      margin: 0 0 8px 0;
      color: var(--primary);
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 2px 2px 0px #ddd6fe;
    }

    .step-text {
      color: var(--secondary);
      font-size: 1.2rem;
      font-weight: 600;
      background: #fce7f3;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .guideline {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .target-slot {
      min-height: 110px;
      background: #f3f4f6;
      border: 4px dashed #cbd5e1;
      border-radius: 24px;
      display: flex;
      flex-wrap: nowrap; /* Memaksa perkataan kekal satu baris */
      justify-content: flex-start; /* Mula dari kiri */
      align-items: center;
      gap: 12px;
      padding: 20px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
      overflow-x: auto; /* Tatal (scroll) melintang jika ayat panjang */
      -webkit-overflow-scrolling: touch; /* Melancarkan scroll di telefon */
    }

    .target-slot.empty {
      justify-content: center; /* Susun di tengah bila belum ada ayat */
    }

    .target-slot.empty::before {
      content: "✨ Tekan perkataan di bawah untuk susun ayat ✨";
      color: #94a3b8;
      font-size: 1.2rem;
      font-weight: 600;
      white-space: normal;
    }

    .target-slot:not(.empty) {
      border-color: var(--primary);
      background: #f5f3ff;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
    }

    /* Mencantikkan bar tatalan (scrollbar) untuk target slot */
    .target-slot::-webkit-scrollbar {
      height: 8px;
    }
    .target-slot::-webkit-scrollbar-track {
      background: transparent;
      margin: 0 15px;
    }
    .target-slot::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 90px;
      margin-bottom: 30px;
    }

    .btn-word {
      background: var(--primary);
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 18px;
      border: none;
      box-shadow: 0 6px 0 var(--primary-dark), 0 10px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      
      flex-shrink: 0; /* Menghalang butang daripada terhimpit */
      white-space: nowrap; /* Menghalang teks daripada turun ke baris baru */
    }

    .btn-word:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 var(--primary-dark), 0 4px 6px rgba(0,0,0,0.15);
    }

    .btn-word.chosen {
      background: var(--secondary);
      box-shadow: 0 6px 0 var(--secondary-dark), 0 10px 15px rgba(0,0,0,0.15);
    }

    .btn-word.chosen:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0 var(--secondary-dark), 0 4px 6px rgba(0,0,0,0.15);
    }

    .action-panel {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-action {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-reset {
      background: var(--warning);
      color: #fff;
      box-shadow: 0 8px 0 var(--warning-dark);
    }

    .btn-check {
      background: var(--success);
      color: #ffffff;
      box-shadow: 0 8px 0 var(--success-dark);
    }

    .btn-action:active {
      transform: translateY(8px);
      box-shadow: 0 0px 0 transparent;
    }

    .shake-box {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      border-color: var(--danger) !important;
      background: #fef2f2 !important;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
      40%, 60% { transform: translate3d(8px, 0, 0); }
    }

    .overlay-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .dialog-box {
      background: #ffffff;
      border-radius: 36px;
      border: 8px solid var(--success);
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .dialog-title {
      font-size: 2.2rem;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .dialog-msg {
      font-size: 1.3rem;
      margin-bottom: 30px;
      line-height: 1.6;
      color: var(--text-main);
    }

    #modal-next-btn {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 600px) {
      .btn-word { font-size: 1.2rem; padding: 10px 18px; }
      h1 { font-size: 2rem; }
      .dialog-box { padding: 30px 20px; }
      .metric-badge { padding: 6px 12px; font-size: 1rem; }
      .btn-action { font-size: 1.1rem; padding: 12px 20px; }
    }
  </style>
</head>
<body>

  <canvas id="canvas-splash"></canvas>

  <div class="main-board">
    <div class="top-panel">
      <div class="metric-badge score-badge">⭐ Skor: <span id="val-score">0</span> / 100</div>
      <div class="metric-badge timer-badge">⏳ <span id="val-time">30:00</span></div>
      <div class="lives-badge" id="val-lives">❤️❤️❤️❤️❤️</div>
    </div>

    <h1>Jom Susun Ayat!</h1>
    <div class="step-text" id="val-step">Soalan 1 / 20</div>
    <div class="guideline">Klik perkataan mengikut urutan yang betul:</div>

    <div class="target-slot empty" id="drop-area"></div>
    <div class="word-pool" id="word-pool"></div>

    <div class="action-panel">
      <button class="btn-action btn-reset" onclick="resetWordPositions()">🔄 Padam Semula</button>
      <button class="btn-action btn-check" onclick="evaluateAnswer()">✅ Semak Jawapan</button>
    </div>
  </div>

  <div class="overlay-modal" id="modal">
    <div class="dialog-box" id="modal-box">
      <div class="dialog-title" id="modal-title">Tahniah!</div>
      <div class="dialog-msg" id="modal-desc">Ayat anda tepat sekali!</div>
      <button class="btn-action btn-check" id="modal-next-btn" onclick="nextQuestion()">Seterusnya ➡️</button>
    </div>
  </div>

  <script>
    const questions = [
      // Tahap Mudah
      { id: 1, correct: ["Ali", "membaca", "buku", "cerita."] },
      { id: 2, correct: ["Cikgu", "Hidayah", "memasak", "sup", "ayam."] }, 
      { id: 3, correct: ["Cikgu", "Fazli", "mencuci", "kereta", "baharu."] }, 
      { id: 4, correct: ["Cikgu", "Masmieza", "menyiram", "pokok", "bunga."] }, 
      { id: 5, correct: ["Cikgu", "Lizah", "mengajar", "di", "dalam", "kelas."] }, 
      { id: 6, correct: ["Adik", "minum", "susu", "segar."] },
      { id: 7, correct: ["Kami", "bermain", "bola", "jaring."] },
      { id: 8, correct: ["Kucing", "tidur", "di", "atas", "kerusi."] },
      { id: 9, correct: ["Murid-murid", "menyapu", "sampah", "di", "kawasan", "sekolah."] },
      { id: 10, correct: ["Cikgu", "Khuzairi", "menanam", "sayur", "bayam."] }, 
      
      // Tahap Sukar (Satu baris memanjang)
      { id: 11, correct: ["Datuk", "sedang", "berehat", "di", "bawah", "pokok", "rambutan."] },
      { id: 12, correct: ["Keluarga", "Amin", "pergi", "berkelah", "di", "tepi", "pantai."] },
      { id: 13, correct: ["Murid-murid", "sedang", "beratur", "semasa", "membeli", "makanan", "di", "kantin."] },
      { id: 14, correct: ["Cikgu", "Akmal", "menunggang", "basikal", "dengan", "berhati-hati", "di", "jalan", "raya."] }, 
      { id: 15, correct: ["Puan", "Siti", "menjual", "kuih-muih", "tradisional", "di", "pasar", "malam."] },
      { id: 16, correct: ["Kamal", "dan", "rakan-rakannya", "bermain", "bola", "sepak", "di", "padang."] },
      { id: 17, correct: ["Doktor", "itu", "merawat", "pesakit", "dengan", "penuh", "kasih", "sayang."] },
      { id: 18, correct: ["Pasukan", "pengakap", "sekolah", "mengadakan", "perkhemahan", "di", "hutan", "simpan."] },
      { id: 19, correct: ["Nelayan", "itu", "menangkap", "ikan", "menggunakan", "pukat", "yang", "besar."] },
      { id: 20, correct: ["Penduduk", "kampung", "bergotong-royong", "membersihkan", "balai", "raya", "pada", "hujung", "minggu."] }
    ];

    let qIndex = 0;
    let score = 0;
    let lives = 5; 
    let secondsLeft = 30 * 60; // 30 minit
    let timerRef = null;
    let availableWords = [];
    let placedWords = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctx = null;

    function initAudio() {
      if (!ctx) {
        ctx = new AudioContext();
      }
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
    }

    function playSoundTone(freq, dur, type = "sine", delay = 0) {
      initAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + dur);
    }

    function soundTap() { playSoundTone(600, 0.1, "triangle"); }
    function soundWin() {
      playSoundTone(523.25, 0.12, "sine", 0);
      playSoundTone(659.25, 0.12, "sine", 0.1);
      playSoundTone(783.99, 0.12, "sine", 0.2);
      playSoundTone(1046.50, 0.4, "triangle", 0.3);
    }
    function soundFail() {
      playSoundTone(300, 0.2, "sawtooth", 0);
      playSoundTone(200, 0.4, "sawtooth", 0.15);
    }
    function soundDone() {
      playSoundTone(330, 0.2, "sine", 0);
      playSoundTone(392, 0.2, "sine", 0.2);
      playSoundTone(523, 0.6, "sine", 0.4);
    }

    const canvas = document.getElementById("canvas-splash");
    const cvsCtx = canvas.getContext("2d");
    let particles = [];
    let splashAnimFrame;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function triggerSplash() {
      particles = [];
      const palette = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93"];
      const midX = window.innerWidth / 2;
      const midY = window.innerHeight / 2;

      for (let i = 0; i < 100; i++) {
        const rad = Math.random() * Math.PI * 2;
        const vel = Math.random() * 12 + 5;
        particles.push({
          x: midX,
          y: midY,
          vx: Math.cos(rad) * vel,
          vy: Math.sin(rad) * vel,
          size: Math.random() * 10 + 5,
          color: palette[Math.floor(Math.random() * palette.length)],
          opacity: 1,
          decay: Math.random() * 0.02 + 0.01
        });
      }
      cancelAnimationFrame(splashAnimFrame);
      runSplash();
    }

    function runSplash() {
      cvsCtx.clearRect(0, 0, canvas.width, canvas.height);
      let isVisible = false;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.opacity -= p.decay;

        if (p.opacity > 0) {
          isVisible = true;
          cvsCtx.save();
          cvsCtx.globalAlpha = p.opacity;
          cvsCtx.fillStyle = p.color;
          cvsCtx.beginPath();
          cvsCtx.roundRect(p.x, p.y, p.size, p.size, 4);
          cvsCtx.fill();
          cvsCtx.restore();
        }
      });

      if (isVisible) {
        splashAnimFrame = requestAnimationFrame(runSplash);
      } else {
        cvsCtx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function initTimer() {
      clearInterval(timerRef);
      timerRef = setInterval(() => {
        secondsLeft--;
        renderTimer();
        if (secondsLeft <= 0) {
          clearInterval(timerRef);
          endGame("Masa Tamat! ⏰", "Masa 30 minit anda telah berakhir.");
        }
      }, 1000);
    }

    function renderTimer() {
      const min = Math.floor(secondsLeft / 60);
      const sec = secondsLeft % 60;
      document.getElementById("val-time").innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function loadSentence() {
      const cur = questions[qIndex];
      placedWords = [];
      document.getElementById("val-step").innerText = `Soalan ${qIndex + 1} / ${questions.length}`;

      let shuffled = [...cur.correct];
      do {
        shuffled.sort(() => Math.random() - 0.5);
      } while (shuffled.join(" ") === cur.correct.join(" ") && shuffled.length > 1);

      availableWords = shuffled.map((txt, i) => ({ id: i, word: txt }));
      drawWordPool();
      drawDropArea();
    }

    function drawWordPool() {
      const pool = document.getElementById("word-pool");
      pool.innerHTML = "";
      availableWords.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "btn-word";
        btn.innerText = item.word;
        btn.onclick = () => addWordToSentence(item);
        pool.appendChild(btn);
      });
    }

    function drawDropArea() {
      const area = document.getElementById("drop-area");
      area.innerHTML = "";
      if (placedWords.length === 0) area.classList.add("empty");
      else area.classList.remove("empty");

      placedWords.forEach((item, pos) => {
        const btn = document.createElement("button");
        btn.className = "btn-word chosen";
        btn.innerText = item.word;
        btn.onclick = () => removeWordFromSentence(pos);
        area.appendChild(btn);
      });
      
      // Auto-scroll ke hujung kanan jika item baru ditambah melebihi skrin
      area.scrollLeft = area.scrollWidth;
    }

    function addWordToSentence(item) {
      soundTap();
      placedWords.push(item);
      availableWords = availableWords.filter(w => w.id !== item.id);
      drawWordPool();
      drawDropArea();
    }

    function removeWordFromSentence(index) {
      soundTap();
      const removed = placedWords.splice(index, 1)[0];
      availableWords.push(removed);
      drawWordPool();
      drawDropArea();
    }

    function resetWordPositions() {
      if(placedWords.length > 0) soundTap();
      availableWords = [...availableWords, ...placedWords];
      placedWords = [];
      drawWordPool();
      drawDropArea();
    }

    function evaluateAnswer() {
      initAudio(); // Memastikan audio aktif
      const currentQ = questions[qIndex];
      const dropEl = document.getElementById("drop-area");

      if (placedWords.length === 0) return;

      const answerText = placedWords.map(w => w.word).join(" ");
      const correctText = currentQ.correct.join(" ");

      if (answerText === correctText) {
        score += 5;
        document.getElementById("val-score").innerText = score;
        soundWin();
        triggerSplash();
        openModal("🌟 TEPAT SEKALI! 🌟", `Ayat yang betul:<br><br><b style="color:var(--primary); font-size:1.5rem;">"${correctText}"</b><br><br><span style="color:var(--success-dark); font-weight:bold;">+5 Markah</span>`, true);
      } else {
        score = Math.max(0, score - 5); // Tidak membenarkan markah negatif
        document.getElementById("val-score").innerText = score;
        lives--;
        renderLives();
        soundFail();

        dropEl.classList.remove("shake-box");
        void dropEl.offsetWidth; // Trigger reflow untuk mengulangi animasi
        dropEl.classList.add("shake-box");

        if (lives <= 0) {
          endGame("💔 Alamak, Nyawa Habis!", `Jangan putus asa, cuba lagi nanti! Jumlah markah anda: <b>${score}/100</b>`);
        } else {
          openModal("❌ CUBA LAGI", `Susunan ayat belum tepat.<br><span style="color:var(--danger); font-weight:bold;">-5 Markah</span><br>Baki nyawa: ${lives}`, false);
        }
      }
    }

    function renderLives() {
      let hearts = "";
      for (let i = 0; i < 5; i++) hearts += (i < lives) ? "❤️" : "🤍";
      document.getElementById("val-lives").innerText = hearts;
    }

    function openModal(title, msg, isSuccess) {
      const modal = document.getElementById("modal");
      const box = document.getElementById("modal-box");
      const titleEl = document.getElementById("modal-title");
      const msgEl = document.getElementById("modal-desc");
      const nextBtn = document.getElementById("modal-next-btn");

      titleEl.innerHTML = title;
      msgEl.innerHTML = msg;

      if (isSuccess) {
        box.style.borderColor = "var(--success)";
        titleEl.style.color = "var(--success)";
        nextBtn.style.background = "var(--success)";
        nextBtn.style.boxShadow = "0 8px 0 var(--success-dark)";
        nextBtn.innerHTML = (qIndex === questions.length - 1) ? "Lihat Keputusan 🏆" : "Seterusnya ➡️";
        nextBtn.onclick = nextQuestion;
      } else {
        box.style.borderColor = "var(--danger)";
        titleEl.style.color = "var(--danger)";
        nextBtn.style.background = "var(--warning)";
        nextBtn.style.boxShadow = "0 8px 0 var(--warning-dark)";
        nextBtn.innerHTML = "Susun Semula 🔁";
        nextBtn.onclick = () => { modal.style.display = "none"; resetWordPositions(); };
      }
      modal.style.display = "flex";
    }

    function nextQuestion() {
      document.getElementById("modal").style.display = "none";
      qIndex++;
      if (qIndex < questions.length) {
        loadSentence();
      } else {
        if (score === 100) {
          endGame("🏆 MARKAH PENUH! 🏆", `Luar biasa! Anda menyusun ayat dengan tepat tanpa sebarang kesilapan.<br><br>Skor Akhir Anda:<br><b style="font-size:3rem; color:var(--primary);">${score}/100</b>`, true);
        } else {
          endGame("🏆 SYABAS! 🏆", `Anda berjaya menamatkan kesemua 20 soalan!<br><br>Skor Akhir Anda:<br><b style="font-size:3rem; color:var(--primary);">${score}/100</b>`, true);
        }
      }
    }

    function endGame(title, msg, isComplete = false) {
      clearInterval(timerRef);
      soundDone(); 
      
      const modal = document.getElementById("modal");
      const box = document.getElementById("modal-box");
      const titleEl = document.getElementById("modal-title");
      const msgEl = document.getElementById("modal-desc");
      const nextBtn = document.getElementById("modal-next-btn");

      box.style.borderColor = "var(--primary)";
      titleEl.style.color = "var(--primary)";
      titleEl.innerHTML = title;
      msgEl.innerHTML = msg;
      
      nextBtn.style.background = "var(--primary)";
      nextBtn.style.boxShadow = "0 8px 0 var(--primary-dark)";
      nextBtn.innerHTML = "Main Semula 🔄";
      nextBtn.onclick = restartGame;

      modal.style.display = "flex";
      triggerSplash();
    }

    function restartGame() {
      qIndex = 0;
      score = 0;
      lives = 5;
      secondsLeft = 30 * 60;
      document.getElementById("val-score").innerText = score;
      renderLives();
      renderTimer();
      document.getElementById("modal").style.display = "none";
      initTimer();
      loadSentence();
    }

    window.onload = () => {
      initTimer();
      loadSentence();
      renderLives();
      
      // Membantu memastikan audio berjalan apabila pengguna klik di mana-mana buat kali pertama
      document.body.addEventListener('click', initAudio, { once: true });
    };
  </script>
</body>
</html>
